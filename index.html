<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="leftside">
            <div class="logo">
                <img src="img/odin-lined.png" alt="The Odin Logo">
                <h1>ODIN</h1>
            </div>
            <p>Photo by <a href="">Halie West</a> on <a href="">Unsplash</a></p>
        </div>

        <div class="rightside">
            <form action="#" method="get">
                <div>
                    <p>This is not real online service! You know you need something like
                        this in your life to help you realize your deepest dreams. <br> 
                        Sign up <em>now</em> to get started.
                    </p>
                    <p>
                        You <em>know</em> you want to.
                    </p>
                </div>
                <div>
                    <fieldset>
                        <h2>Let's do this!</h2>
                        <div class="inputs-container">
                            <div id="left-inputs">
                                <label for="first-name">
                                    <h3>FIRST NAME</h3>
                                    <input type="text" id="first-name">
                                </label>
                                <label for="email">
                                    <h3>EMAIL</h3>
                                    <input type="email" id="email">
                                </label>
                                <label for="password">
                                    <h3>PASSWORD</h3>
                                    <input type="password" id="password" required>
                                </label>
                            </div>
                            <div id="right-inputs">
                                <label for="last-name">
                                    <h3>LAST NAME</h3>
                                    <input type="text" id="last-name">
                                </label>
                                <label for="phone">
                                    <h3>PHONE NUMBER</h3>
                                    <input type="tel" id="phone">
                                </label>
                                <label for="confirm-password">
                                    <h3>CONFIRM PASSWORD</h3>
                                    <input type="password" id="confirm-password" required>
                                </label>
                            </div>
                            <div></div>
                        </div>
                    </fieldset>
                </div>
                <div>
                    <div id="footer">
                        <button type="submit">Create Account</button>
                        <p>Already have an account? <a href="#">Log in</a></p>
                    </div>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
